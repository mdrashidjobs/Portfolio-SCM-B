    body {
      margin: 0;

      display: flex;
      background: #f4f4f4;
    }

    /* LEFT PANEL */
    .left-panel {
      width: 260px;
      height: 100vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      gap: 15px;
    }

    #visitorStats, .sideBox {
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 14px;
    }

    #visitorStats ul {
      padding-left: 18px;
      margin: 0;
    }

    /* PUSH MESSAGE TO BOTTOM */
    .warningBox {
      margin-top: auto;
      color: red;
      border: 1px solid red;
      background: #fff5f5;
      font-weight: bold;
    }

    /* MAIN PANEL */
    .main-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 15px;
      overflow: hidden;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px auto;
      width: 100%;
    }

    button, input[type=range], input[type=text] {
      padding: 8px 12px;
      font-size: 14px;
    }

    #pageSlider {
      width: 180px;
    }

    /* FLIPBOOK */
    .flipbook-viewport {
      margin: 0 auto;
    }

    /* MAGNIFIER */
    .magnifier {
      position: absolute;
      border: 2px solid #aaa;
      border-radius: 50%;
      width: 120px;
      height: 120px;
      overflow: hidden;
      display: none;
      pointer-events: none;
      z-index: 9999;
    }

    .magnifier img {
      position: absolute;
      transform: scale(2);
    }
  </style>
</head>

<script>
function loadApp() {

  const flipbook = $('.flipbook');
  const pageSlider = document.getElementById('pageSlider');
  const pageSound = document.getElementById('pageSound');
  const bgMusic = document.getElementById('bgMusic');
  const musicToggle = document.getElementById('musicToggle');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const magnifier = document.getElementById('magnifier');
  const zoomedImage = document.getElementById('zoomedImage');

  flipbook.turn({
    width: 922,
    height: 600,
    autoCenter: false,
    when: {
      turning: function () {
        pageSound.currentTime = 0;
        pageSound.play().catch(()=>{});
      },
      turned: function (e, page) {
        pageSlider.value = page;
      }
    }
  });

  document.getElementById('firstPage').onclick = () => flipbook.turn('page',1);
  document.getElementById('prevPage').onclick = () => flipbook.turn('previous');
  document.getElementById('nextPage').onclick = () => flipbook.turn('next');
  document.getElementById('lastPage').onclick = () => flipbook.turn('page', flipbook.turn('pages'));

  pageSlider.oninput = () => flipbook.turn('page', parseInt(pageSlider.value));

  musicToggle.onclick = () => {
    if(bgMusic.paused){
      bgMusic.play();
      musicToggle.textContent = "🔊 Music On";
    } else {
      bgMusic.pause();
      musicToggle.textContent = "🔇 Music Off";
    }
  };

  searchBtn.onclick = () => {
    const val = searchInput.value.trim();
    const num = parseInt(val);

    if(!isNaN(num)){
      flipbook.turn('page', num);
    } else {
      const pages = document.querySelectorAll('.flipbook > div');
      let found = false;

      pages.forEach((p,i)=>{
        if(p.dataset.text.toLowerCase().includes(val.toLowerCase()) && !found){
          flipbook.turn('page', i+1);
          found = true;
        }
      });

      if(!found) alert("Not found");
    }
  };

  document.querySelectorAll('.flipbook > div').forEach(page=>{
    page.addEventListener('mouseenter', function(){
      const bg = this.style.backgroundImage.slice(5,-2);
      zoomedImage.src = bg;
      magnifier.style.display = 'block';
    });

    page.addEventListener('mousemove', function(e){
      magnifier.style.left = (e.clientX-60)+'px';
      magnifier.style.top = (e.clientY-60)+'px';
    });

    page.addEventListener('mouseleave', ()=>magnifier.style.display='none');
  });

}

yepnope({
  test: Modernizr.csstransforms,
  yep: ['lib/turn.js'],
  nope: ['lib/turn.html4.min.js'],
  both: ['css/basic.css'],
  complete: loadApp
});
</script>

<script>
document.getElementById('onlineCount').textContent = Math.floor(Math.random()*5)+1;

fetch("https://ipapi.co/json/")
.then(r=>r.json())
.then(d=>{
  document.getElementById("userCountry").textContent = d.country_name;
  document.getElementById("userIP").textContent = d.ip;
})
.catch(()=>{
  document.getElementById("userCountry").textContent = "Unknown";
  document.getElementById("userIP").textContent = "N/A";
});

let visits = localStorage.getItem("siteVisits") || 0;
visits++;
localStorage.setItem("siteVisits", visits);
document.getElementById("totalVisits").textContent = visits;
</script>
